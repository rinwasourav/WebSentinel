[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "websentinel"
version = "0.1.0"
description = "Lightweight authorized web security assessment and reporting framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "WebSentinel contributors"}]
dependencies = ["httpx>=0.27,<1", "platformdirs>=4,<5"]

[project.optional-dependencies]
pdf = ["reportlab>=4,<6"]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=5,<7", "respx>=0.21,<1", "ruff>=0.8,<1", "mypy>=1.13,<2", "bandit>=1.7,<2", "pip-audit>=2.7,<3", "build>=1.2,<2"]

[project.scripts]
websentinel = "websentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/websentinel"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = [".venv", ".tools", ".cache", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["websentinel"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true


[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/.tools", "/.cache", "/dist", "/build"]
