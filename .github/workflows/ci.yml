name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=websentinel --cov-report=term-missing --cov-fail-under=80
      - run: uv run bandit -r src/websentinel
      - run: uv run pip-audit --skip-editable
      - run: uv build
      - name: Verify built wheel CLI
        shell: bash
        run: |
          python -m venv /tmp/websentinel-install
          /tmp/websentinel-install/bin/python -m pip install dist/*.whl
          /tmp/websentinel-install/bin/websentinel --version
          /tmp/websentinel-install/bin/websentinel checks list
